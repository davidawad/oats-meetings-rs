# GENERATED by `oats-meetings-rs config generate` from crates/core/src/config/keys.rs; do not edit

# Commands run on recording and session events, one [[hooks]] table each: event (record.start, record.stop, record.pause, session.saved, transcript.final, notes.generated, calendar.matched), command (argv array; run through the shell only with shell = true), optional name, timeout (default app.hook_timeout), enabled (default true) and cwd (default the session folder). A hook gets OATS_EVENT, OATS_SESSION_ID, OATS_SESSION_DIR, OATS_TITLE, OATS_AUDIO, OATS_TRANSCRIPT and OATS_HOOK in its environment and the event as JSON on stdin. Hooks run in the background and never stop a recording; hook-list shows each run's exit code and output. Edit with hook-add / -edit / -remove / -enable.
hooks = []

[app]
# Hook runs kept (newest first) for hook-list and Settings.
hook_history = 50
# Bytes of a hook run's stdout and of its stderr kept for hook-list and Settings; the rest is read and dropped.
hook_output = 65536
# How often a running hook is checked for having exited (and against its timeout).
hook_poll = "20ms"
# How long a hook may run before it is killed, when its [[hooks]] entry sets no timeout. A hook's own timeout must be in the same range.
hook_timeout = "30s"
# Show a menubar / tray item.
menubar = false
# Refuse to start a second engine on the same control socket.
single_instance = true

[audio]
# Capture backend: auto picks per OS (Linux: pulse, else pipewire; Windows: cpal/WASAPI; macOS: screencapturekit, whose system-audio source is audio.system_backend).
backend = "auto"
# How long devices-list (and the device check of a reload) waits for the audio backend to list its devices before failing with devices_timeout; the GUI shows devices unavailable.
devices_timeout = "3s"
# How long a device listing is reused before the audio backend is asked again.
devices_ttl = "30s"
# Samples per echo-canceller block (rounded up to a power of two): smaller adapts faster, larger costs less.
echo_block = 256
# Cancel speaker echo in the mic using system audio as the reference, and drop local-speaker utterances that repeat near-simultaneous remote speech, so remote speech is not transcribed twice.
echo_cancel = true
# Mic delay inside the echo canceller, so system audio that is captured a little after its echo reached the mic is still cancelled; both channels are shifted by it.
echo_delay = "40ms"
# Percent: the echo canceller's output filter takes the adapting filter when its residual is this many times smaller, and resets it when it is this many times larger (double talk).
echo_divergence = 200
# Percent: during audio.echo_warmup, mic sound whose echo-cancelled residual is below this share of its energy is mostly speaker echo and is muted; local speech, which system audio cannot predict, stays.
echo_dominance = 50
# Echo-canceller adaptation step in per-mille (500 = 0.5): larger converges faster, smaller is steadier.
echo_step = 500
# Longest speaker-to-mic echo the echo canceller models (audio.echo_cancel).
echo_tail = "200ms"
# System-audio sound the echo canceller hears before it counts as converged: until then it adapts with audio.echo_warmup_step and mutes the mic where echo dominates (audio.echo_dominance), so the first remote sentence is not transcribed as you. 0 turns the warmup off.
echo_warmup = "3s"
# Echo-canceller adaptation step in per-mille during audio.echo_warmup (never below audio.echo_step).
echo_warmup_step = 1000
# WAV layout: split is two channels (left system audio, right mic); mix is one summed channel.
layout = "split"
# How long a capture backend waits for audio to start flowing before giving up.
open_timeout = "15s"
# Pause of the recorder writer and of capture readiness polling.
poll_interval = "25ms"
# macOS system-audio source: auto is a Core Audio process tap on macOS 14.2+ (System Audio Recording permission), falling back to ScreenCaptureKit (Screen Recording) on older macOS or a failed tap; tap or screencapturekit force one. Ignored on other OSes.
system_backend = "auto"
# Transcribe while recording (stt.* settings): on fails record-start if the ASR is unavailable, auto records audio only then, off never transcribes.
transcribe = "auto"

[audio.mic]
# Microphone device id (see `ctl devices list`); empty means the default mic.
device = ""
# Record the microphone.
enabled = true

[audio.system]
# System-audio loopback device id (see `ctl devices list`); empty means the default loopback.
device = ""
# Record system audio (what the machine plays).
enabled = true

[calendar]
# How long a Calendars access request (the one macOS prompt) waits for an answer.
access_timeout = "2m"
# All-day events never title a session.
ignore_all_day = true
# Cancelled events never title a session.
ignore_cancelled = true
# Events you declined never title a session (EventKit: the current-user attendee; ICS: an attendee in calendar.me).
ignore_declined = true
# A recording started this long before an event's start still matches it.
match_lead = "5m"
# Comma-separated email addresses that are you, for ICS attendees (declined events; you are left out of participants).
me = ""
# Among overlapping events, prefer one with attendees.
prefer_attendees = true
# Among overlapping events, prefer one with a video-call link (calendar.video_hosts).
prefer_video = true
# record-stop re-matches over the whole recording and updates an automatic title; a title edited by hand is kept.
retitle_on_save = true
# JSON array of calendar sources: {name, kind (ics | eventkit), enabled, feeds (ics: feed names, empty = every enabled feed), accounts / account and calendars (eventkit: account title or email, calendar title or id; both empty = every calendar)}. eventkit is the macOS Calendar app (macOS only). Edit with calendar-source-add / -remove / -enable and calendar-select.
sources = "[{\"name\":\"ics\",\"kind\":\"ics\"}]"
# Session title when no event matches ({date}, {time}, {weekday}); empty leaves the session untitled.
title_fallback = ""
# record-start without a title names the session from the calendar event overlapping now (and records its id and attendees).
title_from_event = true
# Session title from the matched event: {event.title}, {event.calendar}, {event.account}, {event.location}, {event.start} (HH:MM), {date} (YYYY-MM-DD), {time} (HH:MM), {weekday}.
title_template = "{event.title}"
# Comma-separated hosts whose links (in an event's URL, location or notes) count as a video call.
video_hosts = "zoom.us,meet.google.com,teams.microsoft.com,teams.live.com,webex.com,whereby.com,around.co,facetime.apple.com,chime.aws"

[config]
# Watch the user config file and reload on change.
hot_reload = true
# How often the user config file is checked for changes while config.hot_reload is on.
poll_interval = "250ms"

[control]
# Wait after an accept error before trying again.
accept_backoff = "50ms"
# Idle wait of the control-socket accept loop between checks.
accept_poll = "10ms"
# Default wait of oats-ctl for events or for an engine that is still starting (its --timeout-ms flag overrides).
client_timeout = "10s"
# Bytes read per step while discarding the rest of an oversize request line.
drain_chunk = 65536
# Most bytes discarded from one oversize request line before the connection is closed.
drain_max = 8388608
# Events queued per subscriber before a slow one is dropped.
event_queue = 256
# Largest control-socket request line, in bytes; longer lines are refused.
max_line = 1048576
# Control socket path; empty means the per-user runtime dir.
socket = ""

[ics]
# Whether all-day events appear in ics-events.
all_day = "include"
# Allow file:// feeds (local, not gated by network.allow).
allow_file = true
# Directory for cached feeds; empty means ics/ beside the sessions dir.
cache_dir = ""
# Whether STATUS:CANCELLED events appear in ics-events.
cancelled = "hide"
# Time between automatic refreshes of a feed with no refresh_secs of its own; 0s means manual only.
default_refresh = "15m"
# IANA zone for floating times and for the midnight bounds of all-day events.
default_tz = "UTC"
# Master switch for refreshing feeds (manual and scheduled). Cached events stay readable.
enabled = true
# JSON array of feeds: {name, url, enabled, refresh_secs, header}. Edit with ics-add / ics-remove.
feeds = "[]"
# Largest feed body accepted, in bytes.
max_bytes = 5242880
# Longest feed name.
max_name_len = 64
# Most occurrences expanded per recurring event per query.
max_occurrences = 500
# A malformed event fails the whole feed (error) or is dropped and counted (skip).
on_bad_event = "error"
# How often the feed scheduler checks which feeds are due.
poll_interval = "1s"
# When a refresh fails, keep serving the last good cached copy.
stale_on_error = true
# Whole-request timeout for a feed fetch.
timeout = "15s"
# An unknown TZID fails the event (error) or falls back to ics.default_tz.
unknown_tz = "error"
# Scheme webcal:// URLs are fetched with.
webcal_scheme = "https"
# Default length of the ics-events window in days when no end is given.
window_days = 7

[kb]
# Embedding endpoint base URL for kb.embedder ollama / openai-compatible.
base_url = ""
# Knowledge-base folder of .md/.txt files; empty means <data dir>/kb.
dir = ""
# KB embedder: local deterministic hashing, or a model endpoint (gated by network.allow unless loopback).
embedder = "hash"
# Vector length of the local hash embedder. An index records it: changing it makes kb-search refuse the old index until kb-reindex rebuilds it.
hash_dims = 256
# Largest KB chunk, in characters; longer paragraphs are cut.
max_chunk = 1200
# Smallest KB chunk kept, in characters; shorter fragments are dropped. Must not exceed kb.max_chunk.
min_chunk = 20
# Embedding model name for the ollama / openai-compatible embedders.
model = "nomic-embed-text"
# Whole-request timeout for a KB embedding call.
timeout = "2m"

[license]
# Licence holder metadata (placeholder; no licence chosen).
holder = ""
# SPDX expression for packaging metadata (placeholder).
spdx = "LicenseRef-Undecided"

[llm]
# Reference (secret:<namespace>/<name>) to the LLM API key in the secrets backend. The key itself is never in config; store it with secret-set.
api_key_ref = "secret:llm/api-key"
# Notes-generation LLM backend.
backend = "ollama"
# LLM endpoint base URL; empty means the backend default (required for openai-compatible).
base_url = ""
# Model name sent to the LLM backend.
model = "llama3.1"
# Whole-request timeout for a notes-generation LLM call.
timeout = "2m"

[network]
# Allow outward network calls (cloud STT / LLM). Off means such backends are denied.
allow = false
# Characters of a failing HTTP reply kept in the error message (LLM, embedding and cloud STT calls).
error_snippet = 300

[notes]
# Regenerating over existing notes in the Notes view needs a second click.
confirm_regenerate = true
# Template the Notes view picks for regenerating; empty means the first one listed.
default_template = ""
# Reject generated notes that lack a '## ' heading the template's prompt demands.
enforce_headings = true

[privacy]
# Hide the app window from screen capture.
hide_from_capture = true
# How hiding is done; set per OS by the os axis.
hide_method = "none"

[secrets]
# Where secret:<key> references are resolved: environment variables, the OS keychain, or env first then keychain.
backend = "env-then-keyring"
# Prefix of the environment variable holding a secret: secret:ics/work reads OATS_SECRET_ICS_WORK.
env_prefix = "OATS_SECRET_"
# Service name secrets are filed under in the OS keychain.
keyring_service = "oats-meetings-rs"
# Longest secret key (namespace/name).
max_key_len = 128

[sessions]
# Require confirm=true to delete a session.
confirm_delete = true
# Deleting a session moves it to the OS trash (trash) or removes it for good (remove). Provisional default.
delete_mode = "trash"
# Folder session-export writes OpenOats markdown (openoats/v1) into; empty means ~/Documents/oats-meetings/recordings. Dates and file names use ui.tz (empty: the system zone), as OpenOats does.
export_dir = ""
# The recorder: name in markdown exports (OpenOats writes the account's full name); empty leaves the line out.
export_recorder = ""
# Longest session id (it becomes a directory name).
max_id_len = 200
# The OpenOats data folder (its sessions/ and templates.json) session-export-openoats and template-export write into; empty means ~/Library/Application Support/OpenOats.
openoats_dir = ""
# Session store directory (OpenOats layout); empty means the per-user data dir.
root = ""
# Characters of context kept either side of a transcript-search match in its snippet (the Sessions search shows it under the row).
search_snippet_chars = 40

[speakers]
# Speaker names in the markdown export (session-export). openoats: as OpenOats writes them, the microphone side You and everything else Them. labels: the labels the app shows (speakers.*). Either way a name given to a speaker of the session (session-speaker-name) wins.
export = "openoats"

[speakers.mic]
# Split the microphone channel by voice too, for several people sharing a room and a mic: its utterances get the ids room_1, room_2 ... (shown with speakers.mic.template) rather than you. Uses the stt.diarization.* tunables; stt.diarization.algorithm = off turns it off as well.
diarize = false
# How the microphone side (transcript id you) is shown in the app and in exports that use labels; also room_1 when speakers.mic.diarize finds one voice. A name given to a speaker of one session (session-speaker-name) wins.
label = "You"
# How a room speaker (id room_N, speakers.mic.diarize) is shown when the session has more than one: {n} is N. Must contain {n}.
template = "Room {n}"

[speakers.system]
# How the system-audio side is shown when a session has one remote voice (id remote_1 only, or diarization off).
label_single = "Them"
# How a remote speaker (id remote_N) is shown when the session has more than one: {n} is N. Must contain {n}.
template = "Speaker {n}"

[stt]
# Speech-to-text backend: on-device or a cloud adapter.
backend = "local"
# Percent: a short repeat of remote speech (stt.echo_short) is near-end speech, and kept, when the mic's peak over it is above this much of the remote channel's peak at that moment; at or below, it is the speakers bleeding into the mic.
echo_bleed = 25
# Percent of a local-speaker utterance's words, and of its content words (not common words or replies like 'yeah', 'okay', 'right'), that one overlapping remote utterance must say within stt.echo_window of each (each remote word matching once) for it to be dropped as echo. An utterance of common words alone is never echo.
echo_overlap = 60
# With audio.echo_cancel, a local-speaker utterance of at most this many words that repeats a run of words of a remote utterance starting within stt.echo_window of it ('This' as the speakers say 'This is the remote side...') is dropped as speaker echo in the final pass, common words or not, unless the mic is louder than bleed (stt.echo_bleed). 0 turns this off.
echo_short = 2
# Percent: a local-speaker word counts as appearing in remote speech (stt.echo_overlap) when its letter edit-distance similarity to a remote word is at least this, so a misheard echo ('Oaks meeting' for 'Oats Meetings') is still dropped. 100 asks for the exact word.
echo_similarity = 75
# With audio.echo_cancel, a local-speaker utterance whose words remote speech says, or nearly says (stt.echo_similarity), within this time (plus audio.echo_delay) of each word is dropped as speaker echo; double talk with other words at other moments is kept.
echo_window = "1s"
# Window used to feed a recorded file to the live pass as if it were arriving.
feed = "500ms"
# Longest stretch sent in one request in the final pass (cloud uploads are size-limited).
final_piece = "10m"
# Spoken language code passed to the recogniser.
language = "en"
# Silence kept around the speech that is sent to the recogniser.
pad = "250ms"
# Per-mille of full scale: a 10 ms frame whose peak is below this is silence (10 = 0.01).
speech_peak = 10

[stt.cloud]
# Cloud STT adapter; must not be none when stt.backend is cloud.
adapter = "none"
# Secret reference for the cloud STT API key (never the key itself); see the secrets module.
key = "secret:stt/cloud"
# Largest cloud transcription reply accepted, in bytes.
max_response = 8388608
# Model name sent to the cloud STT service.
model = "whisper-1"
# Whole-request timeout for one cloud transcription.
timeout = "1m"
# Base URL of the OpenAI-compatible transcription API.
url = "https://api.openai.com/v1"

[stt.diarization]
# How remote speakers are told apart. neural: a speaker-embedding network (WeSpeaker ResNet34, pyannote community-1, as FluidAudio runs it) on the Apple Neural Engine through CoreML, macOS only. sherpa-onnx: a speaker-embedding network (stt.diarization.sherpa_onnx.model) through onnxruntime, any platform with the sherpa-onnx runtime. spectral: the shape of each utterance's long-term spectrum, pure Rust, no model. off: all remote speech is remote_1. auto: sherpa-onnx, the one measured on real meetings (crates/core/tests/diarize_ami.rs); neural is opt-in until it is. neural falls back to sherpa-onnx and then spectral, sherpa-onnx to spectral, when the model is missing or cannot load (stt-status says which runs and why); the model downloads with stt.local.auto_download, or `ctl stt model fetch model=<id>`.
algorithm = "auto"
# Split the system-audio (them) channel by voice: its utterances get the ids remote_1, remote_2 ... one per distinct remote speaker (shown with speakers.system.template). The microphone channel is you unless speakers.mic.diarize. Off makes all remote speech remote_1 (shown as speakers.system.label_single), whatever stt.diarization.algorithm says.
enabled = true
# Most remote speakers the diarizer tells apart; past this an utterance joins the most similar speaker heard.
max_speakers = 8
# A remote utterance shorter than this never starts a new speaker (too little audio for a reliable voice print); it joins the most similar one.
min_new = "1s"
# A remote speaker with less speech than this in the whole recording is merged into the most similar one: a few stray utterances (a cough, a burst of crosstalk, an echo) do not make a speaker of their own. 0s keeps every speaker found.
min_speaker = "0s"
# spectral: percent voice-print (cosine) similarity at which a remote utterance belongs to a speaker already heard; below it the utterance starts a new remote speaker. Higher splits voices more readily.
threshold = 70

[stt.diarization.neural]
# neural: where the CoreML embedding network runs. auto and coreml: the Neural Engine with the CPU for what it cannot run (MLComputeUnits cpuAndNeuralEngine); cpu: the CPU only.
provider = "auto"
# neural: percent speaker-embedding (cosine) similarity at which a remote utterance belongs to a speaker already heard; below it the utterance starts a new remote speaker. Higher splits voices more readily.
threshold = 50

[stt.diarization.sherpa_onnx]
# sherpa-onnx: the speaker-embedding model (crates/core/data/speaker-models.json): titanet-small (40 MB, NVIDIA NeMo; the best on the AMI meetings of crates/core/tests/diarize_ami.rs), wespeaker-resnet34-lm (26 MB, the network the neural algorithm runs). stt.diarization.sherpa_onnx.threshold is tuned for titanet-small.
model = "titanet-small"
# sherpa-onnx: the onnxruntime execution provider for the speaker-embedding model: auto is coreml on macOS and cpu elsewhere; coreml falls back to the CPU when it cannot load the model.
provider = "auto"
# sherpa-onnx: CPU threads for the speaker-embedding model.
threads = 2
# sherpa-onnx: percent speaker-embedding (cosine) similarity at which a remote utterance belongs to a speaker already heard; below it the utterance starts a new remote speaker. Higher splits voices more readily.
threshold = 20

[stt.final]
# Re-transcribe the whole recording when it stops and write transcript.final.jsonl.
enabled = true

[stt.live]
# Length of audio per live transcription window.
chunk = "4s"
# Transcribe while recording and write transcript.live.jsonl.
enabled = true

[stt.local]
# When the selected local model is missing at app launch (or when a recording starts), download it in the background (about 660 MB for the default Parakeet v2); recordings saved as audio only meanwhile are transcribed when it finishes. Picking a model in the Models tab also downloads it when this and network.allow are both on. Off means transcription stays unavailable until you run `ctl stt model fetch` or press Download. A download you ask for with stt-model-fetch is not gated by this or by network.allow.
auto_download = true
# Local ASR model: an id from the model catalog (stt-model-list shows each with its size, WER and speed). The catalog entry decides the runtime: whisper.cpp for the Whisper models, sherpa-onnx for Parakeet and Moonshine, CoreML for parakeet-tdt-0.6b-v2-coreml (the default: Parakeet v2 on the Apple Neural Engine, as FluidAudio runs it). Where a build has no CoreML (Linux, Windows), or CoreML cannot load the model, parakeet-tdt-0.6b-v2-coreml runs as parakeet-tdt-0.6b-v2 through sherpa-onnx on the CPU; stt-status reports the runtime and compute units in use.
model = "parakeet-tdt-0.6b-v2-coreml"
# Explicit path to the local model; empty means where the model catalog puts stt.local.model under models_dir (a ggml-*.bin file for whisper.cpp models, a directory of files for sherpa-onnx models). Nothing is downloaded for an explicit path.
model_path = ""
# Mirror for model downloads: empty fetches each file from the URL in the model catalog; set, a file comes from <url>/<file> (whisper.cpp) or <url>/<model dir>/<file> (sherpa-onnx). Every file is checked against the catalog's SHA-256, so a mirror must serve the same bytes.
model_url = ""
# Directory holding local model files; empty means models/ beside the sessions dir.
models_dir = ""
# Longest stretch a sherpa-onnx model (Parakeet, Moonshine) decodes at once; longer audio is cut at the quietest point near this length, which bounds memory on long recordings. Each piece is split into sentences by the model's token times. A CoreML model decodes at most its encoder window (15 s for Parakeet v2) at once, cut the same way.
piece = "30s"
# Where sherpa-onnx models (Parakeet, Moonshine) run: auto uses CoreML (Apple Neural Engine / GPU) on macOS and the CPU elsewhere; coreml falls back to the CPU when it cannot load the model. stt-status reports the provider in use. whisper.cpp models always run on the CPU. The CoreML model (parakeet-tdt-0.6b-v2-coreml) runs on the Neural Engine (MLComputeUnits cpuAndNeuralEngine) unless this is cpu (cpuOnly).
provider = "auto"
# CoreML Parakeet (TDT) decoding: tokens emitted at one encoder frame before the decoder is forced to the next frame (FluidAudio maxSymbolsPerStep). Also caps the steps of the end-of-window pass.
tdt_max_symbols = 10
# CoreML Parakeet (TDT) decoding: most tokens decoded from one 15 s encoder window, against runaway output (FluidAudio maxTokensPerChunk).
tdt_max_tokens = 150
# CoreML Parakeet (TDT) decoding: consecutive blanks that end the pass over the last frames of a window, which picks up tokens the main loop stepped past (FluidAudio consecutiveBlankLimit).
tdt_tail_blanks = 5
# CPU threads for local transcription.
threads = 4

[templates]
# Folder of note-template TOML files; empty means <config dir>/templates.
dir = ""

[ui]
# An explicit show request (tray Show Window, ctl window-show) brings the app to the front and gives it focus. The app never takes focus on its own, with this on or off.
activate_on_show = true
# How long a ui-select, ui-state or ui-invoke call waits for the window to answer before failing with timeout.
drive_wait = "10s"
# The Live view scrolls to the newest line while a recording adds lines.
live_follow = true
# Most lines the Live view keeps for one recording; older lines drop first.
live_max_lines = 2000
# The shortest time between two repaints of the level meters (67ms is 15 per second). A meter repaint redraws the meters and the record clock only, never the transcript.
meter_interval = "67ms"
# How many visible steps a level meter has over its 60 dB scale (60 is one per dB): a level change smaller than one step does not repaint the meters.
meter_steps = 60
# Input monitor: live mic and system-audio meters while not recording; the samples feed the meters and are dropped, never recorded or transcribed. window_visible monitors while the window is shown, always while the app runs, off never. Monitoring keeps the mic open, so the macOS orange mic indicator stays on while it runs; system audio uses the existing screen and system audio recording permission.
monitor = "window_visible"
# How long the input monitor waits before it tries a device that failed to open again (a config change retries at once).
monitor_retry = "30s"
# How long after ctl quit the app waits for the GUI to exit before it exits the process itself.
quit_timeout = "5s"
# Show the record strip (state, clock, level meters, Start, Pause / Resume and Stop) on the Live tab.
record_controls = true
# Show the elapsed recording time (the record strip clock and the recording badge).
show_elapsed = true
# Width in pixels of the speaker column in transcript views.
speaker_width = 96
# Start with the main window closed (tray / ctl window-show opens it); off opens it at launch.
start_hidden = false
# Window colours: dark (ink blue), light (paper), or system to follow the OS appearance.
theme = "system"
# How often the window re-reads the engine state (window visibility, capture hiding, tray).
tick = "100ms"
# IANA zone the window shows meeting times in, labelled with its abbreviation; empty is the system zone (TZ, else the OS setting).
tz = ""

[ui.keys]
# Back out: close the shortcuts overlay, leave Recently deleted, clear the Sessions or Settings search, then the selection. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
back = "escape"
# Show or hide the overlay listing every shortcut. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
help = "?"
# Toggle hiding the window from screen capture. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
privacy-toggle = "mod-shift-h"
# Quit. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
quit = "mod-q"
# Pause or resume the recording. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
record-pause = "mod-shift-p"
# Start recording. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
record-start = "mod-shift-r"
# Stop recording (and transcribe). Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
record-stop = "mod-shift-s, s"
# Start recording when idle, else pause or resume it (never stops). Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
record-toggle = "space"
# Search: on Settings, focus its search bar (filters settings live); anywhere else, open Sessions with the search box focused. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
search = "/"
# Reload the session list. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
session-list = "mod-r"
# New session: clear the Live tab of the finished session it shows (it stays in Sessions), ready for the next Start. Only while idle. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
session-new = "mod-shift-n, n"
# Select the next session in the Sessions list. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
sessions-next = "j, down"
# Open the selected session's notes. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
sessions-open = "enter"
# Select the previous session in the Sessions list. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
sessions-prev = "k, up"
# Go to the Calendar tab. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
tab-calendar = "5"
# Go to the Live tab. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
tab-live = "1"
# Go to the Models tab. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
tab-models = "6"
# Go to the Notes tab. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
tab-notes = "3"
# Go to the Sessions tab. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
tab-sessions = "2"
# Go to the Settings tab. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
tab-settings = "7"
# Go to the Templates tab. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
tab-templates = "4"
# Hide the window. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
window-hide = "mod-w"
# Show the window. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
window-show = "mod-shift-o"
# Show or hide the window. Comma-separated keystrokes, empty for none; mod is cmd on macOS and ctrl elsewhere.
window-toggle = "mod-shift-w"
