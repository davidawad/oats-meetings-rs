[package]
name = "oats-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
interprocess.workspace = true
oats-audio.workspace = true
keyring.workspace = true
trash.workspace = true
toml_edit.workspace = true
chrono.workspace = true
icalendar.workspace = true
rrule.workspace = true
chrono-tz.workspace = true
hound.workspace = true
sha2.workspace = true
whisper-rs = { workspace = true, optional = true }

[features]
# Local ASR (whisper.cpp). Off here (crate-level default stays lean for the Windows check) but ON in the root package default
# features; it needs cmake, a C++ compiler and libclang to build.
whisper = ["dep:whisper-rs"]
# Local ASR through sherpa-onnx (Parakeet TDT, Moonshine). Off here, ON in the root package default features; the build
# fetches a prebuilt sherpa-onnx + onnxruntime library.
parakeet = ["dep:sherpa-onnx"]

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true

# TLS: rustls (ring) everywhere except Windows, which uses the OS stack (schannel) so no C
# toolchain is needed to build or cross-check there.
[target.'cfg(not(windows))'.dependencies]
ureq = { workspace = true, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
ureq = { workspace = true, features = ["native-tls"] }

# sherpa-onnx (feature parakeet): static everywhere but macOS. On macOS the prebuilt static onnxruntime has no CoreML
# execution provider, the shared one does (dot-4uzgol.66), so link libsherpa-onnx-c-api / libonnxruntime dylibs there;
# the build copies them beside the binary (rpath @loader_path) and packaging/macos/make-app.sh bundles them.
[target.'cfg(target_os = "macos")'.dependencies]
sherpa-onnx = { workspace = true, optional = true, features = ["shared"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
sherpa-onnx = { workspace = true, optional = true, features = ["static"] }
