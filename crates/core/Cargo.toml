[package]
name = "oats-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
interprocess.workspace = true
oats-audio.workspace = true
keyring.workspace = true
trash.workspace = true
toml_edit.workspace = true
serde_yaml_ng.workspace = true
chrono.workspace = true
icalendar.workspace = true
rrule.workspace = true
chrono-tz.workspace = true
hound.workspace = true
sha2.workspace = true
# The system zone for export timestamps (ui.tz empty), as OpenOats uses the system zone.
iana-time-zone = "0.1"
# Calendar providers (dot-4uzgol.100): PKCE / HTTP Basic encodings and the PKCE verifier's randomness.
base64 = "0.22"
getrandom = "0.3"
whisper-rs = { workspace = true, optional = true }

[features]
# Local ASR (whisper.cpp). Off here (crate-level default stays lean for the Windows check) but ON in the root package default
# features; it needs cmake, a C++ compiler and libclang to build.
whisper = ["dep:whisper-rs"]
# Local ASR through sherpa-onnx (Parakeet TDT, Moonshine). Off here, ON in the root package default features; the build
# fetches a prebuilt sherpa-onnx + onnxruntime library.
parakeet = ["dep:sherpa-onnx"]

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true

# TLS: rustls (ring) everywhere except Windows, which uses the OS stack (schannel) so no C
# toolchain is needed to build or cross-check there.
[target.'cfg(not(windows))'.dependencies]
ureq = { workspace = true, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
# Hooks: kill a timed-out hook's whole process group.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
ureq = { workspace = true, features = ["native-tls"] }

# sherpa-onnx (feature parakeet): static everywhere but macOS. On macOS the prebuilt static onnxruntime has no CoreML
# execution provider, the shared one does (dot-4uzgol.66), so link libsherpa-onnx-c-api / libonnxruntime dylibs there;
# the build copies them beside the binary (rpath @loader_path) and packaging/macos/make-app.sh bundles them.
[target.'cfg(target_os = "macos")'.dependencies]
sherpa-onnx = { workspace = true, optional = true, features = ["shared"] }
# The CoreML runtime (dot-4uzgol.69): Parakeet v2 as compiled .mlmodelc bundles on the Neural Engine, driven from Rust.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSPredicate", "NSSet", "NSString", "NSURL", "NSValue"] }
# The macOS Calendar app's store (dot-4uzgol.88): eventkit calendar sources.
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKParticipant", "EKSource", "EKTypes"] }
block2 = "0.6"
objc2-core-ml = { version = "0.3", default-features = false, features = ["std", "MLDictionaryFeatureProvider", "MLFeatureDescription", "MLFeatureProvider", "MLFeatureValue", "MLModel", "MLModelConfiguration", "MLModelDescription", "MLMultiArray", "MLMultiArrayConstraint", "MLPredictionOptions"] }

# os-local calendars on Linux (dot-4uzgol.100): Evolution Data Server's offline caches are SQLite.
[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

# os-local calendars on Windows (dot-4uzgol.100): Windows.ApplicationModel.Appointments.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["std", "ApplicationModel_Appointments", "Foundation", "Foundation_Collections"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
sherpa-onnx = { workspace = true, optional = true, features = ["static"] }
