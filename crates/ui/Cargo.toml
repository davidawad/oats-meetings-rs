[package]
name = "oats-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
oats-core.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6"

# Native menubar / tray item. macOS / Windows use tray-icon; Linux / BSD speak StatusNotifierItem
# over D-Bus with ksni (no gtk / libappindicator; zbus on async-io, already in the tree via GPUI),
# dot-4uzgol.41. With no SNI host on the bus, `app.menubar = true` reports "unsupported" once.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.21", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
oats-audio.workspace = true
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
toml.workspace = true

[features]
runtime_shaders = ["gpui_platform/runtime_shaders"]

[[test]]
name = "macos_sharing_type"
harness = false
