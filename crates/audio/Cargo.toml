[package]
name = "oats-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# cpal is the Windows (WASAPI loopback + mic) backend. Linux is pulse/pipewire (no libasound), and macOS
# capture is dot-4uzgol.6 and must not pull coreaudio into off-macOS cross-checks.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.15"

# ScreenCaptureKit (macOS 13+) is the macOS system-audio source; the mic is cpal/CoreAudio.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11.1.1"

[dev-dependencies]
tempfile.workspace = true
