[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "crates/ctl", "."]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Placeholder: no licence chosen (David's ruling, dot-4uzgol). Do not publish.
license = "LicenseRef-Undecided"
publish = false

[workspace.dependencies]
# Pinned zed rev (zed-industries/zed main on 2026-10-27).
gpui = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f", features = ["x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
interprocess = "2"
toml_edit = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tempfile = "3"
icalendar = "0.17"
rrule = "0.14"
chrono-tz = "0.10"
ureq = "3"
oats-core = { path = "crates/core" }
oats-ui = { path = "crates/ui" }
oats-ctl = { path = "crates/ctl" }

[package]
name = "oats-meetings-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oats-core.workspace = true
oats-ctl.workspace = true
oats-ui = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[features]
default = ["gui"]
gui = ["dep:oats-ui"]
