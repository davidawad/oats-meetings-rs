[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "crates/ctl", "crates/audio", "."]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Placeholder: no licence chosen (David's ruling, dot-4uzgol). Do not publish.
license = "LicenseRef-Undecided"
publish = false

[workspace.dependencies]
# Pinned zed rev (zed-industries/zed main on 2026-10-27).
gpui = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f", features = ["x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
interprocess = "2"
tiny_http = "0.12"
trash = "5"
toml_edit = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tempfile = "3"
icalendar = "0.17"
rrule = "0.14"
chrono-tz = "0.10"
ureq = { version = "3", default-features = false, features = ["gzip"] }
keyring = "4"
hound = "3"
whisper-rs = "0.16"
sherpa-onnx = "1.13"
sha2 = "0.10"
oats-core = { path = "crates/core" }
oats-audio = { path = "crates/audio" }
oats-ui = { path = "crates/ui" }
oats-ctl = { path = "crates/ctl" }

[package]
name = "oats-meetings-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
oats-core.workspace = true
oats-ctl.workspace = true
oats-ui = { workspace = true, optional = true }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
oats-audio.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tiny_http.workspace = true

[features]
# whisper: local ASR (whisper.cpp), so a stock build transcribes out of the box (dot-4uzgol.26). It needs cmake, a C++
# compiler and libclang. Windows builds pass `--no-default-features --features gui` until whisper-rs is proven there.
default = ["gui", "whisper"]
gui = ["dep:oats-ui"]
whisper = ["oats-core/whisper"]
