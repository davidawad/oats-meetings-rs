[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "crates/ctl", "crates/audio", "."]

[workspace.package]
version = "0.0.1"
edition = "2021"
# GPL-3.0-or-later (David, 2026-11-15; LICENSE). publish = false only keeps it off crates.io; it ships as a macOS app.
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Pinned zed rev (zed-industries/zed main on 2026-10-27).
gpui = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f", features = ["x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
interprocess = "2"
tiny_http = "0.12"
trash = "5"
toml_edit = "0.22"
# The user config file may be YAML (dot-4uzgol.87); the maintained fork of serde_yaml.
serde_yaml_ng = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tempfile = "3"
icalendar = "0.17"
rrule = "0.14"
chrono-tz = "0.10"
ureq = { version = "3", default-features = false, features = ["gzip"] }
keyring = "4"
hound = "3"
whisper-rs = "0.16"
# Link mode (static / shared) is chosen per target in crates/core/Cargo.toml.
sherpa-onnx = { version = "1.13", default-features = false }
sha2 = "0.10"
oats-core = { path = "crates/core" }
oats-audio = { path = "crates/audio" }
oats-ui = { path = "crates/ui" }
oats-ctl = { path = "crates/ctl" }

[package]
name = "oats-meetings-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
oats-core.workspace = true
oats-ctl.workspace = true
oats-ui = { workspace = true, optional = true }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
oats-audio.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tiny_http.workspace = true

[features]
# whisper: local ASR (whisper.cpp), so a stock build transcribes out of the box (dot-4uzgol.26). It needs cmake, a C++
# compiler and libclang. parakeet: the sherpa-onnx runtime (Parakeet, Moonshine; the default model is Parakeet v2,
# dot-4uzgol.66); its build downloads a prebuilt sherpa-onnx + onnxruntime static library. Both are on in the macOS and
# Linux release builds (ci/package-linux.sh, packaging/macos/make-app.sh build the default features). Windows builds
# pass `--no-default-features --features gui` until whisper-rs and sherpa-onnx are proven there.
default = ["gui", "whisper", "parakeet"]
gui = ["dep:oats-ui"]
whisper = ["oats-core/whisper"]
parakeet = ["oats-core/parakeet"]
