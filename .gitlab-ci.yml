# Free shared Linux runners only. macOS/Windows real builds are manual and need paid runners:
# do not enable without David. macOS cross-check cannot run off-macOS (dot-4uzgol.15 owns macOS).
stages: [check, build]

.nix: &nix
  # nixos/nix pinned by digest (2.31.3); system libs come from the pinned nixpkgs in ci/linux-nix.sh.
  image: nixos/nix@sha256:d49538facc7757890eccfa5f57869ad18c823c24903e3b8ac6ca8a301d84a9b6
  variables: {CARGO_NET_GIT_FETCH_WITH_CLI: "true"}
  before_script:
    - nix-env -iA nixpkgs.git nixpkgs.bash nixpkgs.coreutils || true

linux-build:
  <<: *nix
  stage: build
  script:
    - bash ci/linux-nix.sh

windows-check:
  <<: *nix
  stage: check
  variables: {CROSS_TARGET: x86_64-pc-windows-msvc}
  script:
    - bash ci/linux-nix.sh

macos-build:
  stage: build
  when: manual
  tags: [saas-macos-medium-m1]
  script: [cargo build --workspace, cargo run -q -- --headless --version]

windows-build:
  stage: build
  when: manual
  tags: [saas-windows-medium-amd64]
  script: [cargo build --workspace, cargo run -q -- --headless --version]
